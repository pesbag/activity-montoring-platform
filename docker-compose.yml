services:
  db:
    image: mysql:8.4
    container_name: sqlDb
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: stationDb
    ports:
     - "3306:3306"
    volumes:
      - type: bind
        source: ./seed_tables.sql
        target: /docker-entrypoint-initdb.d/seed_tables.sql
  
  python_seed_service:
    build:
      context: .
      dockerfile: dockerfile

  broker:
    image: apache/kafka:latest
    container_name: broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10

  py-producer:
    build:
      context: .
      dockerfile: py_producer/dockerfile
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=broker:29092
      - KAFKA_EVENT_DELAY_SECONDS=0.2
    depends_on:
      broker:
        condition: service_healthy
  
  raw-consumer:
    build:
      context: ./RawConsumer
      dockerfile: dockerfile
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=broker:29092
      - Kafka__Consumer__BootstrapServers=broker:29092
      - MongoDb__ConnectionString=mongodb://mongo:27017
    depends_on:
      broker:
        condition: service_healthy
      mongo: 
        condition: service_started

  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  py-consumer:
    build:
      context: .
      dockerfile: Analystics_Service/dockerfile
    depends_on:
      broker:
        condition: service_healthy
      py-producer:
        condition: service_started
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=broker:29092
      - WINDOW_SIZE=20
      - Z_THRESHOLD=3.5
      - CRITICAL_THRESHOLD=4.5

volumes:
  mongo_data: